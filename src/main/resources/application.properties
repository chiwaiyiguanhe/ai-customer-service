spring.application.name=ai-customer-service
server.port=8082

# ==================== DeepSeek LLM 配置 ====================
# 同步对话模型（Assistant 使用）
langchain4j.open-ai.chat-model.api-key=${DEEPSEEK_API_KEY}
langchain4j.open-ai.chat-model.base-url=https://api.deepseek.com/v1
langchain4j.open-ai.chat-model.model-name=deepseek-chat
langchain4j.open-ai.chat-model.log-requests=true
langchain4j.open-ai.chat-model.log-responses=true

# 流式对话模型（StreamingAssistant 使用）
langchain4j.open-ai.streaming-chat-model.api-key=${DEEPSEEK_API_KEY}
langchain4j.open-ai.streaming-chat-model.base-url=https://api.deepseek.com/v1
langchain4j.open-ai.streaming-chat-model.model-name=deepseek-chat
langchain4j.open-ai.streaming-chat-model.log-requests=true
langchain4j.open-ai.streaming-chat-model.log-responses=true

# ==================== 日志配置 ====================
logging.level.com.ai=DEBUG
logging.level.dev.langchain4j=DEBUG

# ==================== 可观测性配置 ====================
management.endpoints.web.exposure.include=*
management.tracing.sampling.probability=1

# ==================== MySQL 数据库配置 ====================
spring.datasource.url=jdbc:mysql://localhost:3306/agent?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:MyNewPass123!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== JPA 配置 ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==================== Swagger 配置 ====================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
